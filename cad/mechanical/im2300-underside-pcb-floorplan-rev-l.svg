<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="-30 -43 491.8 371" role="img" aria-labelledby="title desc" style="background:#111418">
  <title id="title">Radxa CM5 ProComm iM2300 underside PCB floorplan Rev L</title>
  <desc id="desc">A2 underside plan showing controlled six-point M3 support patterns for both long PCBs, panel and frame load paths for user-operated connectors, the 15 millimeter four-side frame keepout, low-profile bottom equipment tray, guarded hinge-side PSU bay, bottom-side CM5 and modem cooling cartridges, sidewall airflow, and protected routing corridors.</desc>
  <defs>
    <pattern id="minorGrid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M10 0H0V10" fill="none" stroke="#2b3138" stroke-width=".22"/></pattern>
    <pattern id="majorGrid" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="url(#minorGrid)"/><path d="M50 0H0V50" fill="none" stroke="#39414a" stroke-width=".34"/></pattern>
    <pattern id="floorHatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#8c6a94" stroke-width=".6"/></pattern>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse"><path d="M6 3L0 0V6Z" fill="#aab3bd"/></marker>
    <marker id="batteryArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#c493e8"/></marker>
    <style>
      .page{fill:#111418}.panel{fill:#171c21;stroke:#c4ccd4;stroke-width:1.2}.safe{fill:none;stroke:#58616b;stroke-width:.45;stroke-dasharray:3 2}.grid{fill:url(#majorGrid);opacity:.5}
      .audio{stroke:#52c7d5}.network{stroke:#69d391}.rf{stroke:#e4b95f}.service{stroke:#76a7f7}.backup{stroke:#c493e8}.mains{stroke:#f27767}.lighting{stroke:#f4d8a2}.board{stroke-width:.8}.zone{stroke-width:.6;stroke-dasharray:3 2}.keep{fill:none;stroke-width:.55;stroke-dasharray:2 2}
      .route{fill:none;stroke-width:1.1;stroke-dasharray:3 2}.airflow{fill:none;stroke:#54c8d6;stroke-width:1.2;stroke-dasharray:3 2;marker-end:url(#arrow)}.mount{fill:#0d1013;stroke:#d7dee4;stroke-width:.5}.mountKeepout{fill:none;stroke:#d7dee4;stroke-width:.35;stroke-dasharray:1.2 1}.module{fill:#11171c;stroke-width:.55}.dim{fill:none;stroke:#aab3bd;stroke-width:.45;marker-start:url(#arrow);marker-end:url(#arrow)}.extension{stroke:#6f7983;stroke-width:.35}
      .title{fill:#f6f8fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:7.2px;font-weight:750}.subtitle{fill:#aeb7c0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:3.05px}.label{fill:#eef2f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:3.15px;font-weight:650;text-anchor:middle}.small{fill:#bac3cc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:2.55px;text-anchor:middle}.tiny{fill:#aeb8c2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:2.15px;text-anchor:middle}.note{fill:#aeb8c2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:2.25px}.dimension{fill:#bdc6ce;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:3px;text-anchor:middle}.psunote{fill:#ff8a7b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:2.25px;font-weight:650;text-anchor:middle}.label,.small,.tiny,.note,.dimension,.psunote{stroke:none}
      text{letter-spacing:0}
    </style>
  </defs>

  <rect class="page" x="-30" y="-43" width="491.8" height="371"/>
  <text class="title" x="0" y="-32">RADXA CM5 PROCOMM - iM2300 UNDERSIDE PCB FLOORPLAN</text>
  <text class="subtitle" x="0" y="-24">REV L / A2 HOLD | CONTROLLED A1-A6 + C1-C6 M3 SUPPORTS | PANEL/FRAME CARRIES ALL USER MATING LOADS | SAMPLE-CONTROLLED FIT</text>

  <line class="extension" x1="0" y1="0" x2="0" y2="-13"/><line class="extension" x1="431.8" y1="0" x2="431.8" y2="-13"/>
  <line class="dim" x1="1.5" y1="-10" x2="430.3" y2="-10"/><text class="dimension" x="215.9" y="-12.5">431.8 NOMINAL - FINISHED OUTLINE REQUIRES MEASURED 38.1 mm RECESS</text>
  <line class="extension" x1="0" y1="0" x2="-16" y2="0"/><line class="extension" x1="0" y1="298" x2="-16" y2="298"/>
  <line class="dim" x1="-13" y1="1.5" x2="-13" y2="296.5"/><text class="dimension" x="-17.5" y="149" transform="rotate(-90 -17.5 149)">298.0 NOMINAL</text>

  <rect class="panel" x="0" y="0" width="431.8" height="298" rx="10"/>
  <rect class="grid" x="0" y="0" width="431.8" height="298" rx="10"/>
  <rect class="safe" x="15" y="15" width="401.8" height="268" rx="4"/>
  <text class="tiny" x="215.9" y="6">HINGE / DISPLAY HARNESS SIDE</text>
  <text class="tiny" x="215.9" y="294">OPERATOR / HANDLE SIDE</text>

  <!-- Support rail keepout -->
  <rect class="keep service" x="15" y="15" width="401.8" height="268" rx="4"/>
  <text class="small" x="215.9" y="12.8">15 mm MINIMUM CUSTOM FOUR-SIDE FRAME / SCREW KEEPOUT - INDEPENDENT OF PCB MOUNTS</text>

  <!-- Low-profile bottom equipment tray envelope; actual outline follows measured floor ribs. -->
  <rect x="90" y="15" width="258" height="268" rx="3" fill="none" stroke="#87919c" stroke-width=".45" stroke-dasharray="4 2"/>
  <text class="tiny" x="219" y="290">2.0 mm 5052-H32 BOTTOM TRAY | TOP MAX 3.0 mm ABOVE DEEPEST FLOOR | FINAL OUTLINE FROM CASE SURVEY</text>

  <!-- Panel-mounted night lighting and rear-body clearance -->
  <rect class="zone lighting" x="85" y="15" width="134" height="44" rx="3" fill="#332d24" fill-opacity=".26"/>
  <text class="label" x="152" y="20">2 x YIS LS102W + E-SWITCH CS7L2FR</text>
  <circle class="keep lighting" cx="108" cy="37" r="14"/>
  <circle class="keep lighting" cx="153" cy="37" r="12.5"/>
  <circle class="keep lighting" cx="198" cy="37" r="14"/>
  <text class="tiny" x="108" y="55.5">LIGHT 1</text><text class="tiny" x="153" y="55.5">TOUCH LATCH</text><text class="tiny" x="198" y="55.5">LIGHT 2</text>

  <!-- AUDIO-8X8 suspended board -->
  <rect class="zone audio" x="15" y="15" width="78" height="268" rx="3" fill="#173036" fill-opacity=".5"/>
  <text class="label" x="11" y="149" transform="rotate(-90 11 149)">AUDIO-8X8 | 78 x 268 MAX | A1-A6</text>
  <line class="audio" x1="54" y1="31" x2="54" y2="277" stroke-width=".35" stroke-dasharray="1.5 1.5"/>
  <g fill="#0d1013" stroke="#52c7d5" stroke-width=".55">
    <circle cx="26.4" cy="34" r="11.4"/><circle cx="69.78" cy="34" r="11.4"/>
    <circle cx="26.4" cy="66" r="11.4"/><circle cx="69.78" cy="66" r="11.4"/>
    <circle cx="26.4" cy="98" r="11.4"/><circle cx="69.78" cy="98" r="11.4"/>
    <circle cx="26.4" cy="130" r="11.4"/><circle cx="69.78" cy="130" r="11.4"/>
    <circle cx="26.4" cy="162" r="11.4"/><circle cx="69.78" cy="162" r="11.4"/>
    <circle cx="26.4" cy="194" r="11.4"/><circle cx="69.78" cy="194" r="11.4"/>
    <circle cx="26.4" cy="226" r="11.4"/><circle cx="69.78" cy="226" r="11.4"/>
    <circle cx="26.4" cy="258" r="11.4"/><circle cx="69.78" cy="258" r="11.4"/>
  </g>
  <g class="mountKeepout"><circle cx="47" cy="21" r="4"/><circle cx="87" cy="21" r="4"/><circle cx="47" cy="149" r="4"/><circle cx="87" cy="149" r="4"/><circle cx="47" cy="277" r="4"/><circle cx="87" cy="277" r="4"/></g>
  <g class="mount"><circle cx="47" cy="21" r="1.7"/><circle cx="87" cy="21" r="1.7"/><circle cx="47" cy="149" r="1.7"/><circle cx="87" cy="149" r="1.7"/><circle cx="47" cy="277" r="1.7"/><circle cx="87" cy="277" r="1.7"/></g>
  <path d="M98 15V283" fill="none" stroke="#52c7d5" stroke-width="1.2" stroke-dasharray="3 2"/>
  <text class="tiny" x="101" y="149" transform="rotate(-90 101 149)">AUDIO QUIET BOUNDARY - NO FANS, PWM WIRING, OR SWITCH NODES</text>

  <!-- Central battery/dock vertical keepout and left-to-right engagement sweep -->
  <rect class="zone backup" x="86" y="63" width="130" height="151" rx="4" fill="#2d2037" fill-opacity=".28"/>
  <rect class="keep backup" x="86" y="75" width="24" height="132" rx="3"/>
  <rect class="keep backup" x="110" y="75" width="99" height="132" rx="4"/>
  <text class="label" x="151" y="70">GOLD MOUNT / DOCK KEEPOUT</text>
  <text class="small" x="151" y="78">ENGAGE LEFT TO RIGHT | REMOVE RIGHT TO LEFT</text>
  <path d="M91 85H205" fill="none" stroke="#c493e8" stroke-width="1.2" marker-end="url(#batteryArrow)"/>
  <text class="tiny" x="151" y="91">SLIDE TRAVEL + LEFT HAND CLEARANCE FROM SAMPLE</text>

  <!-- Bottom-mounted PSU in guarded hinge-side bay; rotated and shifted away from audio. -->
  <rect x="244" y="15" width="98" height="142" rx="2" fill="#3a211f" fill-opacity=".16" stroke="#f27767" stroke-width=".9" stroke-dasharray="3 2"/>
  <rect x="250" y="21" width="86" height="130" rx="2" fill="url(#floorHatch)" stroke="#f27767" stroke-width=".8"/>
  <rect x="96" y="190" width="116" height="80" rx="2" fill="url(#floorHatch)" stroke="#c493e8" stroke-width=".8" stroke-dasharray="3 2"/>
  <text class="label" x="154" y="220">PWR-SELECT</text><text class="small" x="154" y="226">116 x 80 STARTING ENVELOPE</text><text class="small" x="154" y="232">BOTTOM FLOOR - CANDIDATE</text>
  <text class="tiny" x="160" y="274">PSU/PWR LOCATIONS REQUIRE 3D CHECK WITH BATTERY DOCK, C14 BODY, AND CARRIER</text>

  <!-- Guarded mains corridor -->
  <rect class="zone mains" x="146" y="232" width="72" height="55" rx="3" fill="#3a211f" fill-opacity=".25"/>
  <text class="label" x="182" y="241">GUARDED AC CORRIDOR</text>
  <rect class="module mains" x="166" y="244" width="36" height="44" rx="1"/>
  <text class="tiny" x="184" y="267">FUSED C14</text>
  <path class="route mains" d="M184 244C184 210 190 155 190 101"/>
  <text class="tiny" x="194" y="153" transform="rotate(-90 194 153)">GUARDED AC HARNESS TO HINGE-SIDE PSU</text>

  <!-- CM5-CARRIER suspended board -->
  <rect class="zone network" x="219" y="15" width="166" height="268" rx="3" fill="#173426" fill-opacity=".36"/>
  <text class="label" x="302" y="31">CM5-CARRIER | 166 x 268 MAX | C1-C6</text>
  <g class="mountKeepout"><circle cx="225" cy="21" r="4"/><circle cx="379" cy="21" r="4"/><circle cx="225" cy="149" r="4"/><circle cx="331" cy="149" r="4"/><circle cx="225" cy="277" r="4"/><circle cx="379" cy="205" r="4"/></g>
  <g class="mount"><circle cx="225" cy="21" r="1.7"/><circle cx="379" cy="21" r="1.7"/><circle cx="225" cy="149" r="1.7"/><circle cx="331" cy="149" r="1.7"/><circle cx="225" cy="277" r="1.7"/><circle cx="379" cy="205" r="1.7"/></g>
  <rect x="244" y="15" width="98" height="142" rx="2" fill="#f27767" fill-opacity=".035" stroke="#f27767" stroke-width=".55" stroke-dasharray="2 2"/>

  <!-- Network and high-speed placement -->
  <rect class="module network" x="232" y="34" width="135" height="74" rx="2"/>
  <text class="label" x="299.5" y="42">ETHERNET / PCIE ZONE</text>
  <rect class="module network" x="238" y="48" width="28" height="19"/><rect class="module network" x="276" y="48" width="28" height="19"/><rect class="module network" x="238" y="75" width="28" height="19"/><rect class="module network" x="276" y="75" width="28" height="19"/>
  <text class="tiny" x="252" y="60">WAN1</text><text class="tiny" x="290" y="60">WAN2</text><text class="tiny" x="252" y="87">LAN1</text><text class="tiny" x="290" y="87">LAN2</text>
  <rect class="module service" x="313" y="50" width="20" height="20"/><text class="tiny" x="323" y="61">REFCLK</text><text class="tiny" x="323" y="65">RESET</text>
  <rect class="module network" x="332" y="46" width="30" height="51"/><text class="tiny" x="347" y="66">MINI PCIE</text><text class="tiny" x="347" y="71">AW7915-NP1</text><text class="tiny" x="347" y="76">4T4R WIFI</text>
  <text class="psunote" x="293" y="113">PSU BELOW: B.Cu PART AND SWITCH-NODE KEEPOUT</text>

  <!-- WWAN and carrier control. WWAN card and cooling cartridge are on B.Cu. -->
  <rect class="module service" x="232" y="116" width="55" height="40" rx="2"/><text class="tiny" x="259.5" y="132">HEADSET + FAN</text><text class="tiny" x="259.5" y="137">CONTROL + SENSORS</text><text class="tiny" x="259.5" y="142">SERVICE LOGIC</text>
  <rect class="module rf" x="350" y="116" width="30" height="52" rx="1"/><text class="tiny" x="365" y="136">M.2 B-KEY</text><text class="tiny" x="365" y="141">WWAN 3052</text><text class="tiny" x="365" y="146">B.Cu / FACES DOWN</text>
  <circle class="keep service" cx="365" cy="142" r="20"/><text class="tiny" x="365" y="172">MODEM HEATSINK + DELTA AFB0412SHB-SP04 / 15 mm</text>

  <!-- Power conversion in the digital airflow chamber; no top-panel fan bodies. -->
  <rect class="zone service" x="225" y="180" width="153" height="61" rx="2" fill="#17263d" fill-opacity=".18"/>
  <text class="tiny" x="301.5" y="186">DIGITAL / POWER AIRFLOW + BAFFLE CHAMBER</text>
  <rect class="module mains" x="235" y="191" width="56" height="48" rx="1"/><text class="tiny" x="263" y="204">SYS_5V15 + NET</text><text class="tiny" x="263" y="209">HIGH-CURRENT</text><text class="tiny" x="263" y="214">POWER STAGES</text>
  <rect class="module mains" x="315" y="191" width="56" height="48" rx="1"/><text class="tiny" x="343" y="204">AUX + MODEM</text><text class="tiny" x="343" y="209">WIFI + FAN</text><text class="tiny" x="343" y="214">POWER STAGES</text>
  <path class="airflow" d="M421 220C386 220 368 211 350 194C334 179 338 158 353 146C330 145 310 160 299 181C286 204 292 239 315 257C323 265 319 279 310 291"/>

  <!-- Radxa CM5 and attached cooling cartridge are mounted on B.Cu facing down. -->
  <rect class="module service" x="318.5" y="240" width="55" height="40" rx="2"/><text class="label" x="346" y="253">RADXA CM5</text><text class="small" x="346" y="259">eMMC ONLY / B.Cu</text>
  <rect class="keep service" x="316" y="237.5" width="60" height="45" rx="2"/>
  <circle class="keep service" cx="346" cy="260" r="20"/>
  <text class="tiny" x="346" y="269">5540A + FFB0412 CARTRIDGE</text>
  <text class="tiny" x="346" y="275">FAN INLET FACES BOTTOM / 10 mm MIN GAP</text>

  <!-- Local high-speed fanout beside CM5 -->
  <rect x="294" y="108" width="18" height="140" rx="2" fill="#31517a" fill-opacity=".13" stroke="#76a7f7" stroke-width=".45" stroke-dasharray="2 2"/>
  <text class="tiny" x="307" y="175" transform="rotate(-90 307 175)">PROTECTED PCIE / USB3 / NATIVE-GBE TRUNK</text>
  <rect class="module service" x="293" y="248" width="20" height="20" rx="1"/>
  <text class="tiny" x="303" y="257">PCIE</text><text class="tiny" x="303" y="262">SWITCH</text>
  <path class="route service" d="M318.5 255H313M303 248V108M303 108C297 96 293 82 290 67M303 108C286 103 270 99 252 94M303 108C299 103 295 99 290 94M303 108C316 101 332 99 350.5 98"/>
  <path class="route network" d="M318.5 252H309V112C293 99 274 82 252 67"/>
  <text class="tiny" x="316" y="246">SHORT UPSTREAM</text>

  <!-- USB3 WWAN path leaves the central trunk above the power zone -->
  <path class="route service" d="M303 174V168H336C346 168 349 156 350 149"/>
  <text class="tiny" x="324" y="165">USB3 WWAN</text>

  <!-- Local lid-harness and differential TDM interfaces beside CM5 -->
  <rect class="module service" x="240" y="250" width="47" height="22" rx="1"/>
  <text class="tiny" x="263.5" y="257">HDMI + USB TOUCH</text><text class="tiny" x="263.5" y="262">12 V DISPLAY</text><text class="tiny" x="263.5" y="267">LID HARNESS CONNECTORS</text>
  <path class="route service" d="M318.5 261H287"/>
  <rect class="module audio" x="291" y="273" width="23" height="10" rx="1"/>
  <text class="tiny" x="302.5" y="280">LVDS TDM</text>
  <path class="route audio" d="M318.5 273H314"/>

  <!-- Independent fused AUX_12V panel-light harness along the battery/carrier boundary -->
  <rect class="module lighting" x="219" y="28" width="8" height="12" rx="1"/>
  <text class="tiny" x="223" y="45">J-NL</text>
  <path class="route lighting" d="M219 34H213V60.5H198M153 60.5H108M153 60.5V49M108 60.5V51M198 60.5V51"/>

  <!-- RF/coax corridor -->
  <rect class="zone rf" x="390" y="15" width="26.8" height="268" rx="3" fill="#382f19" fill-opacity=".3"/>
  <text class="label" x="406.5" y="18">RF COAX</text>
  <text class="small" x="406.5" y="23">CORRIDOR</text>
  <text class="tiny" x="406.5" y="28">8 COAX: WIFI 1-4 + CELL 1-4</text>
  <path class="route rf" d="M347 58C372 58 386 35 406 35M362 68C380 68 390 69 406 69M362 78C380 80 391 96 406 103M357 90C378 96 392 124 406 137M380 128C389 136 397 160 406 171M380 140C390 153 398 191 406 205M380 151C391 171 399 224 406 239M378 164C389 192 399 258 406 273"/>
  <text class="tiny" x="406.5" y="286">NO SWITCH NODES / USB3 / PCIE UNDER COAX</text>

  <!-- Inter-board harnesses -->
  <path class="route audio" d="M90.5 170H219V278H291"/>
  <text class="small" x="154.5" y="166">DIFFERENTIAL TDM HARNESS ABOVE FLOOR PSU</text>
  <text class="tiny" x="154.5" y="174">LVDS BUFFERED + SHIELDED + INTERLEAVED GROUNDS</text>
  <path class="route backup" d="M212 215C216 215 217 198 219 198"/>
  <text class="tiny" x="215" y="225">PROTECTED_RAW</text>
  <path class="route audio" d="M212 242C176 249 132 252 90.5 252"/>
  <text class="tiny" x="132" y="247">SEPARATE CLEAN AUDIO POWER</text>
  <path d="M205 8V48C205 56 219 56 219 68V235C219 248 229 261 240 261" fill="none" stroke="#76a7f7" stroke-width="4.5" stroke-opacity=".16"/>
  <path class="route service" d="M205 8V48C205 56 219 56 219 68V235C219 248 229 261 240 261"/>
  <path d="M216 68V235" fill="none" stroke="#76a7f7" stroke-width=".45" stroke-dasharray="2 2"/>
  <path d="M229 68V235" fill="none" stroke="#76a7f7" stroke-width=".45" stroke-dasharray="2 2"/>
  <text class="tiny" x="205" y="18">HINGE-EDGE LID HARNESS NOTCH</text>
  <text class="tiny" x="226" y="190" transform="rotate(-90 226 190)">LID HARNESS | 15 mm MIN TO PSU GUARD</text>

  <!-- Sidewall cooling interfaces are below the panel plane and need 3D validation. -->
  <path d="M421 198V242" stroke="#54c8d6" stroke-width="2.2"/>
  <text class="small" x="418" y="220" transform="rotate(-90 418 220)">RIGHT INTAKE - SIDEWALL REV C</text>
  <path d="M290 287H330" stroke="#e4b95f" stroke-width="2.2"/>
  <text class="small" x="310" y="294">OPERATOR EXHAUST - SIDEWALL REV C</text>

  <!-- Legend and release notes -->
  <rect x="0" y="306" width="431.8" height="22" fill="#111418"/>
  <text class="psunote" x="215.9" y="303">FLOOR PSU BAY: 98 x 142 OUTER | RPS-400-24-C: 86 x 130 x 43 | COMPLETE GUARD Z MAX 48</text>
  <rect x="5" y="311" width="12" height="7" fill="#173036" stroke="#52c7d5"/><text class="note" x="21" y="316">TOP-PANEL SUSPENDED PCB</text>
  <rect x="92" y="311" width="12" height="7" fill="url(#floorHatch)" stroke="#c493e8"/><text class="note" x="108" y="316">BOTTOM-FLOOR HARDWARE</text>
  <line x1="203" y1="314.5" x2="220" y2="314.5" stroke="#52c7d5" stroke-width="1.1" stroke-dasharray="3 2"/><text class="note" x="224" y="316">HARNESS / CONTROLLED ROUTE</text>
  <line x1="331" y1="314.5" x2="348" y2="314.5" stroke="#76a7f7" stroke-width="2.2" opacity=".7"/><text class="note" x="352" y="316">HIGH-SPEED TRUNK</text>
  <text class="note" x="0" y="324">A2 HOLD: A1-A6/C1-C6 use M3 NPTH dia 3.4, dia 8 all-copper keepout, dia 10 component keepout; release connector capture coupons and physical fit before routing.</text>
</svg>
